name: constanza_player
description: "Constanza Músicas — Sua música. Seu silêncio. Seu momento."
publish_to: 'none'
version: 1.3.4+12

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # === STATE MANAGEMENT ===
  flutter_riverpod: ^3.0.0

  # === I18N ===
  intl: any

  # === NAVEGAÇÃO ===
  go_router: ^14.8.1

  # === AUDIO ===
  just_audio: ^0.10.5
  just_audio_background: ^0.0.1-beta.12
  audio_service: ^0.18.15
  audio_session: ^0.1.21
  on_audio_query: ^2.9.0

  # === STORAGE ===
  permission_handler: ^12.0.1
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3

  # === UI/UX ===
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2

  # === IMAGE PICKER ===
  image_picker: ^1.1.2

  # === FILE PICKER ===
  # Seletor nativo de arquivos via SAF (Android Storage Access Framework).
  file_picker: ^8.1.4

  # === NETWORK / IMAGENS ONLINE ===
  http: ^1.2.2
  cached_network_image: ^3.4.1

  # === SHARE ===
  # v12+ exige AGP >=8.12.1 + Kotlin 2.2.0. Mantemos v11 (mesma API SharePlus.instance).
  share_plus: ^11.1.0

  # === UTILS ===
  equatable: ^2.0.7

  # Necessário para resolver warning de fontes do Flutter (algum widget transitivo
  # referencia a família CupertinoIcons sem bundle-la).
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#1A1A2E"
  adaptive_icon_foreground: "assets/icon/icon.png"

flutter:
  uses-material-design: true
  generate: true