name: constanza_player
description: "Constanza M????sicas ???????? Sua m????sica. Seu sil????ncio. Seu momento."
publish_to: 'none'
version: 1.6.0+27

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # === STATE MANAGEMENT ===
  flutter_riverpod: ^3.0.0

  # === I18N ===
  intl: any

  # === NAVEGA?????????O ===
  go_router: ^14.8.1

  # === AUDIO ===
  just_audio: ^0.10.5
  just_audio_background: ^0.0.1-beta.12
  audio_service: ^0.18.15
  audio_session: ^0.1.21
  on_audio_query: ^2.9.0

  # === WINDOWS DESKTOP ===
  # audiotags: leitura de metadata (ID3v2/FLAC/MP4/OGG) via FFI ???????? substitui
  # on_audio_query no Windows (que ???? Android/iOS only).
  audiotags: ^1.4.2
  # smtc_windows: System Media Transport Controls ???????? notifica????????o de m????dia
  # nativa do Windows (substitui audio_service no Windows).
  smtc_windows: ^0.1.3
  # just_audio_media_kit: backend de playback para Windows/Linux usando libmpv.
  # just_audio nativamente s???? suporta Android/iOS/Web ???????? sem este pacote
  # setFilePath() "sucede" silenciosamente mas nenhum ????udio sai.
  just_audio_media_kit: ^2.1.0
  media_kit_libs_windows_audio: ^1.0.9
  # window_manager: remove a title bar nativa do Windows e exp????e APIs para
  # set min size, maximize, drag region, etc. Mesma libs em Linux e macOS.
  window_manager: ^0.5.1

  # === STORAGE ===
  permission_handler: ^12.0.1
  path_provider: ^2.1.5
  path: ^1.9.0
  shared_preferences: ^2.3.3

  # === UI/UX ===
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2

  # === IMAGE PICKER ===
  image_picker: ^1.1.2

  # === FILE PICKER ===
  # Seletor nativo de arquivos via SAF (Android Storage Access Framework).
  file_picker: ^8.1.4

  # === NETWORK / IMAGENS ONLINE ===
  http: ^1.2.2
  cached_network_image: ^3.4.1

  # === SHARE ===
  # v12+ exige AGP >=8.12.1 + Kotlin 2.2.0. Mantemos v11 (mesma API SharePlus.instance).
  share_plus: ^11.1.0

  # === URL LAUNCHER ===
  # Abre links externos (pol????tica de privacidade hospedada no GitHub Pages).
  url_launcher: ^6.3.1

  # === UTILS ===
  equatable: ^2.0.7

  # Necess????rio para resolver warning de fontes do Flutter (algum widget transitivo
  # referencia a fam????lia CupertinoIcons sem bundle-la).
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  msix: ^3.16.13

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#1A1A2E"
  adaptive_icon_foreground: "assets/icon/icon.png"
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 256

# === MSIX (pacote sideload auto-assinado) ===
# Gera build/windows/.../constanza_player.msix + um certificado de teste.
# Para instalar: confiar no .cer (Trusted People) e abrir o .msix.
msix_config:
  display_name: Constanza M????sicas
  publisher_display_name: Constanza
  # Subject do certificado de teste auto-gerado. Em sideload pode ser
  # qualquer CN; s???? precisa bater entre o .cer instalado e o pacote.
  publisher: CN=Constanza, O=Constanza, C=BR
  identity_name: com.constanza.constanzaPlayer
  # MSIX exige vers????o de 4 partes (x.y.z.w). Mantemos sincronizado com a
  # vers????o do app (1.5.1) + revis????o 0.
  msix_version: 1.5.1.0
  logo_path: assets/icon/icon.png
  # internetClient: busca de letras (lrclib) e capas.
  # broadFileSystemAccess: sem isto o AppContainer do MSIX bloqueia a
  # leitura por caminho cru ???????? Directory.list e o libmpv falham EM SIL????NCIO
  # em pastas escolhidas pelo usu????rio (umas m????sicas tocam, outras n????o;
  # pasta aparece vazia). Capability restrita: o msix package injeta o
  # namespace rescap automaticamente.
  capabilities: "internetClient, broadFileSystemAccess"
  # Arquitetura do build atual.
  architecture: x64
  store: false
  # Certificado auto-assinado determin????stico (gerado por certs/make_cert.ps1).
  # Subject DEVE bater com `publisher` acima, sen????o a instala????????o falha.
  certificate_path: certs/constanza.pfx
  # Senha N????O fica no repo: passar na hora do build, ex.:
  #   dart run msix:create --certificate-password $env:CONSTANZA_PFX_PASSWORD
  # N????o tenta instalar o cert via prompt interativo (quebra em CI/terminal
  # n????o-interativo). A instala????????o do .cer ???? passo manual documentado.
  install_certificate: false

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/developer/
    - assets/icon/icon.png