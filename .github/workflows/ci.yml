name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  analyze:
    name: Analyze & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.6'
          cache: true

      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze

  # Job de build APK foi removido temporariamente: o plugin on_audio_query 2.9.0
  # (último release há 2 anos) usa package= no AndroidManifest, incompatível
  # com a AGP 8.x estrita do runner do GitHub. Local builda OK porque AGP 8.9.1
  # é mais permissivo. Enquanto o plugin não for atualizado/substituído, o gate
  # de build vive no laptop (flutter build apk --release antes de cada release).
